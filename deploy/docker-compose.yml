version: '2.4'
services:
  api:
    image: ${DORM_API_IMAGE:-dorm-menu:local}
    restart: unless-stopped
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 32
    volumes:
      - ./data:/data
      - ./config:/config:ro
    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev
    environment:
      BIND: 0.0.0.0:3000
      DATA_DIR: /data
      TOKEN_FILE: /config/tokens.json
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-86400}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-30}
      RUST_LOG: info
    # Loopback only. A host tunnel can reach this; no NAS management ports exposed.
    ports:
      - '127.0.0.1:3000:3000'
    logging:
      driver: json-file
      options:
        max-size: '2m'
        max-file: '2'
